# Default-deny all ingress/egress in the namespace, then allow only
# the specific paths the app needs. This is the Zero Trust baseline.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rag-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: rag-platform
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: rag-app
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - port: 5432
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-ollama
  namespace: rag-platform
spec:
  podSelector:
    matchLabels:
      app: ollama
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: rag-app
      ports:
        - port: 11434
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-mlflow
  namespace: rag-platform
spec:
  podSelector:
    matchLabels:
      app: mlflow
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: rag-app
      ports:
        - port: 5000
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: rag-platform
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mlflow-egress
  namespace: rag-platform
spec:
  podSelector:
    matchLabels:
      app: mlflow
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - ports:
        - protocol: TCP
          port: 443 # Allow PyPI access if psycopg2 is installed dynamically
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress
  namespace: rag-platform
spec:
  podSelector:
    matchLabels:
      role: rag-app
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - port: 11434
    - to:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - port: 5000
  policyTypes:
    - Egress
