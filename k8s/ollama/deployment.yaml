apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "4Gi"
            limits:
              memory: "12Gi"
      volumes:
        - name: ollama-data
          emptyDir: {}
