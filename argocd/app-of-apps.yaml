# App-of-apps pattern: this one Application deploys the k8s/ manifests.
# Point repoURL at your own git remote once you push this project.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-rag-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/local-rag-platform.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
